<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Shopee - ReJStore</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
        .container{max-width:900px;margin:auto;background:#fff;border-radius:15px;padding:30px;box-shadow:0 15px 35px rgba(0,0,0,.2)}
        .config-section,.links-section,.results-section{margin-bottom:25px;padding:25px;border:2px solid #e8e8e8;border-radius:12px;background:#fafafa}
        textarea,input{width:100%;padding:14px;border:2px solid #ddd;border-radius:8px;font-size:15px}
        button{padding:14px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer}
        .btn{background:#667eea;color:#fff}
        #apiLog{background:#111;color:#0f0;font-family:monospace;padding:10px;min-height:150px;border-radius:8px}
    </style>
</head>
<body>
<div class="container">
    <h2>Bot Shopee - ReJStore (API Arrocy-WG)</h2>

    <div class="config-section">
        <h3>⚙️ Configurações da API</h3>
        <label>URL da API:</label>
        <input id="apiUrl" placeholder="https://example.com/message/send">

        <label>Token da API:</label>
        <input id="apiToken" placeholder="Seu token aqui">
    </div>

    <div class="config-section">
        <h3>📝 Mensagem Base</h3>
        <textarea id="customMessage">Confira: {link}
Promoção ReJStore!</textarea>
    </div>

    <div class="links-section">
        <h3>🔗 Links Shopee</h3>
        <textarea id="linksInput" placeholder="Cole os links aqui, um por linha..."></textarea>
        <button class="btn" onclick="convertLinks()">Converter</button>
    </div>

    <div class="results-section">
        <h3>📄 Mensagens Geradas</h3>
        <div id="messagesList"></div>
        <button class="btn" onclick="sendAll()">Enviar Tudo</button>
    </div>

    <div class="config-section">
        <h3>📜 Log da API</h3>
        <div id="apiLog"></div>
    </div>
</div>

<script>
function log(msg){
    const box=document.getElementById('apiLog');
    box.innerText+=`
${msg}`;
    box.scrollTop=box.scrollHeight;
}

function convertLinks(){
    const raw=document.getElementById('linksInput').value.trim().split(/
+/);
    const template=document.getElementById('customMessage').value;
    const box=document.getElementById('messagesList');
    box.innerHTML="";

    raw.forEach((l,i)=>{
        if(!l) return;
        const msg=template.replace('{link}',l.trim());

        const div=document.createElement('div');
        div.innerHTML=`<textarea id="msg_${i}" style="margin-bottom:10px">${msg}</textarea>`;
        box.appendChild(div);
    });
}

async function sendAll(){
    const url=document.getElementById('apiUrl').value;
    const token=document.getElementById('apiToken').value;
    const msgs=[...document.querySelectorAll('#messagesList textarea')];

    for(const m of msgs){
        await sendMessage(url,token,m.value);
        await new Promise(r=>setTimeout(r,1500));
    }
}

async function sendMessage(apiUrl,token,message){
    try{
        log(`Enviando: ${message.substring(0,50)}...`);

        const res=await fetch(apiUrl,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
            body:JSON.stringify({message})
        });

        const data=await res.text();
        log(`Resposta: ${data}`);

    }catch(e){log('Erro: '+e.message);}
}
</script>
</body>
</html>
