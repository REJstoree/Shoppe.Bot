{

.header {

}

color: #333;

}
.header p {
color: #666;
font-size: 1.1em;
}
.config-section, .links-section, .results-section {
margin-bottom: 25px;
padding: 25px;
border: 2px solid #e8e8e8;
border-radius: 12px;
background: #fafafa;
}
h3 {
color: #444;
margin-bottom: 20px;
font-size: 1.3em;
display: flex;
align-items: center;
gap: 10px;
}
.input-group {
margin-bottom: 20px;
}
label {
display: block;
margin-bottom: 8px;
font-weight: 600;
color: #555;
}
input, textarea {
width: 100%;
padding: 14px;
border: 2px solid #ddd;
border-radius: 8px;
font-size: 15px;
transition: all 0.3s ease;

}

}

font-size: 14px;
}
.button-group {
display: flex;
gap: 10px;
flex-wrap: wrap;
}
button {
padding: 14px 24px;
border: none;
border-radius: 8px;
cursor: pointer;
font-size: 15px;
font-weight: 600;
transition: all 0.3s ease;
display: flex;
align-items: center;
gap: 8px;
}
.btn-primary {
background: linear-gradient(135deg, #667eea, #764ba2);
color: white;
}
.status {
padding: 15px;
border-radius: 8px;
text-align: center;
font-weight: 600;
margin: 20px 0;
transition: all 0.3s ease;
}
.success {
background: #d4edda;
color: #155724;
border: 1px solid #c3e6cb;
}
.error {
background: #f8d7da;
color: #721c24;
border: 1px solid #f5c6cb;
}
.info {
background: #d1ecf1;
color: #0c5460;
border: 1px solid #bee5eb;
}
.instructions {
background: #e7f3ff;
padding: 20px;
border-radius: 8px;
border-left: 4px solid #667eea;
margin-top: 20px;
}
.instructions h4 {
color: #333;
margin-bottom: 15px;
}
.help-text {
font-size: 13px;
}
</style>
<div class="header">
Configurações do BotConfigurar a API Arrocy-WG para utilizar Token e URL.
Configuração da API
<label for="apiUrl">URL da API Arrocy-WG<input type="text" id="apiUrl" placeholder="Insira a URL da API">
<div class="input-group">
<label for="apiToken">Token de Acesso<input type="text" id="apiToken" placeholder="Insira o Token de Acesso">
<div class="button-group">
<button class="btn-primary" onclick="connectToAPI()">Conectar à API<div class="results-section">
Resultados
function connectToAPI() {
const apiUrl = document.getElementById('apiUrl').value;
const apiToken = document.getElementById('apiToken').value;
// Exemplo de chamada à API utilizando Fetch
fetch(apiUrl, {
method: 'GET',
headers: {
'Authorization': Bearer ${apiToken}
}
})
.then(response => response.json())
.then(data => {
document.getElementById('convertedLinks').innerText = JSON.stringify(data);
})
.catch(error => {
console.error('Erro:', error);
});
}
